name: ICLR calibration (paperreview.ai protocol)

# Runs the skill on ICLR 2026 submissions sampled by evals/iclr_calibration.py, then
# fits the 7-dimension linear map on the train split and reports Spearman and AUC on
# the test split. Paid: every paper is a full panel review through the API.
#
# Ground truth (human scores, decisions) never reaches the review jobs: they get the
# blinded paper text only. The evaluate job rebuilds the sample from the seed.
#
# pipeline "split" (evals/split/) runs each phase in a fresh context instead:
# Phase 0, four parallel reviewers, the Gap Scout, the literature and report check
# (with the Devil's Advocate challenge), then the EIC.
# pipeline "check" (skill 2.11) runs Phase 0 and the reviewers in one context, the Gap
# Scout and the check each in a fresh context, and resumes the first context for the EIC.
# budget is then the cap per phase. auth "subscription" uses CLAUDE_CODE_OAUTH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      split:
        description: "Which papers: all, train or test"
        default: "all"
      offset:
        description: "Skip this many papers of the split (to run in batches)"
        default: "0"
      limit:
        description: "Number of papers (0 = all). Start with a pilot of 2."
        default: "2"
      model:
        description: "Model for the review runs"
        default: "claude-haiku-5-5"
      max_parallel:
        description: "Concurrent review jobs"
        default: "2"
      pipeline:
        description: "single (one context, evals/review_prompt.md), split (one fresh context per phase, evals/split/) or check (one context plus a fresh check context)"
        default: "single"
      auth:
        description: "api (ANTHROPIC_API_KEY, billed per token) or subscription (CLAUDE_CODE_OAUTH_TOKEN)"
        default: "api"
  # Manual dispatch needs the workflow on the default branch. Until it is there, a
  # push that changes evals/iclr_run.json (same keys as the inputs) starts a run.
  # {"mode": "evaluate", "runs": [<run ids>]} only collects earlier runs' results
  # and computes the metrics.
  push:
    branches: [claude/youthful-einstein-mpsrkh, claude/next-independent-check]
    paths: [evals/iclr_run.json]

permissions:
  contents: read

env:
  # Every ICLR 2026 submission with its human reviews (withdrawn ones included).
  DATA_URL: https://huggingface.co/datasets/JerMa88/ICLR_Peer_Reviews_2026/resolve/main/data/iclr_2026.parquet
  CUTOFF: "2025-09-24"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      split: ${{ steps.c.outputs.split }}
      offset: ${{ steps.c.outputs.offset }}
      limit: ${{ steps.c.outputs.limit }}
      model: ${{ steps.c.outputs.model }}
      max_parallel: ${{ steps.c.outputs.max_parallel }}
      mode: ${{ steps.c.outputs.mode }}
      runs: ${{ steps.c.outputs.runs }}
      budget: ${{ steps.c.outputs.budget }}
      effort: ${{ steps.c.outputs.effort }}
      pick: ${{ steps.c.outputs.pick }}
      pipeline: ${{ steps.c.outputs.pipeline }}
      auth: ${{ steps.c.outputs.auth }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = {"split": "all", "offset": "0", "limit": "2", "model": "claude-haiku-5-5",
                 "max_parallel": "2", "mode": "review", "runs": "",
                 "budget": "3", "pick": "order", "effort": "",
                 "pipeline": "single", "auth": "api"}
          given = json.loads(os.environ.get("INPUTS") or "null") or {}
          if not given and os.path.exists("evals/iclr_run.json"):
              given = json.load(open("evals/iclr_run.json"))
          if isinstance(given.get("runs"), list):
              given["runs"] = ",".join(str(r) for r in given["runs"])
          cfg.update({k: str(v) for k, v in given.items() if k in cfg})
          assert cfg["mode"] in ("review", "evaluate")
          assert cfg["pick"] in ("order", "stratified", "balanced")
          assert re.fullmatch(r"[0-9]+(\.[0-9]+)?", cfg["budget"])  # USD cap per paper
          assert re.fullmatch(r"[0-9,]*", cfg["runs"])
          assert cfg["split"] in ("all", "train", "test")
          assert all(cfg[k].isdigit() for k in ("offset", "limit", "max_parallel"))
          assert re.fullmatch(r"claude-[a-z0-9.-]+", cfg["model"])
          assert cfg["pipeline"] in ("single", "split", "check")
          assert cfg["auth"] in ("api", "subscription")
          assert cfg["effort"] in ("", "low", "medium", "high", "xhigh", "max")
          for k, v in cfg.items():
              print(f"{k}={v}")
          PY

  prepare:
    needs: config
    if: needs.config.outputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ids: ${{ steps.find.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y poppler-utils && python -m pip install pyarrow
      - name: Sample (seeded) and find full text
        id: find
        run: |
          curl -sSfL --retry 4 -o /tmp/reviews.parquet "$DATA_URL"
          W=evals/work/benchmarks/iclr2026
          python3 -I evals/iclr_calibration.py sample /tmp/reviews.parquet --out $W/sample.jsonl
          # Text sources were found once and committed (IDs only): the paperreview.ai
          # dump (submission PDFs) or arXiv v1. OpenReview returns 403 from runners.
          python3 -I evals/iclr_calibration.py fetch $W/sample.jsonl evals/iclr2026_sources.json \
            --split "${{ needs.config.outputs.split }}" --offset "${{ needs.config.outputs.offset }}" --limit "${{ needs.config.outputs.limit }}" \
            --pick "${{ needs.config.outputs.pick }}" --ids-out ids.json \
            $( [ -f evals/iclr2026_reviewed.json ] && echo --reviewed evals/iclr2026_reviewed.json ) \
            $( [ -f evals/iclr2026_prefer.json ] && echo --prefer evals/iclr2026_prefer.json )
          echo "ids=$(cat ids.json 2>/dev/null || echo '[]')" >> "$GITHUB_OUTPUT"
          # Ship the blinded text only: no sample, no PDFs, no arXiv metadata.
          mkdir -p ship
          for d in evals/work/papers/iclr26-*; do
            if [ -f "$d/blinded.txt" ]; then
              mkdir -p "ship/$(basename "$d")" && cp "$d/blinded.txt" "ship/$(basename "$d")/"
            fi
          done
      - uses: actions/upload-artifact@v4
        with: {name: papers, path: ship, retention-days: 7}

  review:
    needs: [config, prepare]
    if: needs.prepare.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.config.outputs.pipeline == 'single' && 90 || 180 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.config.outputs.max_parallel) }}
      matrix:
        id: ${{ fromJSON(needs.prepare.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: papers, path: evals/work/papers}
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review (single context)
        if: needs.config.outputs.pipeline == 'single'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ID: ${{ matrix.id }}
        run: |
          # Only this paper's text stays in the workspace.
          find evals/work/papers -mindepth 1 -maxdepth 1 ! -name "$ID" -exec rm -rf {} +
          mkdir -p "evals/work/results/$ID"
          python3 - <<'PY' > prompt.md
          import os
          root, pid = os.getcwd(), os.environ["ID"]
          t = open("evals/review_prompt.md").read().split("---", 1)[1]
          t = (t.replace("{ID}", pid).replace("{ROOT}", root)
                .replace("{VENUE_NAME}", "ICLR").replace("{VENUE_KEY}", "iclr"))
          t = t.replace("Full review, skip confirmation.",
                        "Full review, skip confirmation, literature check: strict, "
                        "cutoff date " + os.environ["CUTOFF"] + ".")
          t = t.replace("or access the web.",
                        "or access the web, except through the skill's own "
                        "scripts/related_search.py for the literature check.")
          print(t)
          PY
          claude -p "$(cat prompt.md)" --model "${{ needs.config.outputs.model }}" \
            ${{ needs.config.outputs.effort && format('--effort {0}', needs.config.outputs.effort) || '' }} \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" "Bash(python3:*)" \
            --max-budget-usd "${{ needs.config.outputs.budget }}" --output-format json > "evals/work/results/$ID/run.json" || true
          python3 -c "import json;r=json.load(open('evals/work/results/$ID/run.json'));print('cost_usd',r.get('total_cost_usd'),'turns',r.get('num_turns'))" || true
          ls -la "evals/work/results/$ID"
      - name: Review (split or check, evals/split/)
        if: needs.config.outputs.pipeline != 'single'
        env:
          ANTHROPIC_API_KEY: ${{ needs.config.outputs.auth == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.config.outputs.auth == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ID: ${{ matrix.id }}
          MODEL: ${{ needs.config.outputs.model }}
          EFFORT: ${{ needs.config.outputs.effort }}
          BUDGET: ${{ needs.config.outputs.budget }}
          LIT: strict
          PIPELINE: ${{ needs.config.outputs.pipeline }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          find evals/work/papers -mindepth 1 -maxdepth 1 ! -name "$ID" -exec rm -rf {} +
          evals/split/run_paper.sh "$ID" || true
          # The shared prompt holds the paper text; the redacted copy stays in phase0/.
          rm -f "evals/work/results/$ID/prompts/shared.md"
          ls -laR "evals/work/results/$ID" | head -60
      - uses: actions/upload-artifact@v4
        with: {name: "result-${{ matrix.id }}", path: "evals/work/results/${{ matrix.id }}", retention-days: 30}

  evaluate:
    needs: [config, review]
    if: always() && needs.config.result == 'success' && (needs.review.result != 'skipped' || needs.config.outputs.mode == 'evaluate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyarrow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: "result-*", path: results}
      - name: Results of earlier runs
        if: needs.config.outputs.runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.config.outputs.runs }}
        run: |
          for id in ${RUNS//,/ }; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -p 'result-*' -D results || echo "run $id: no results"
          done
      - name: Features, cost and metrics
        run: |
          mkdir -p results
          for d in results/result-*; do [ -d "$d" ] && rm -rf "results/${d#results/result-}" && mv "$d" "results/${d#results/result-}"; done
          curl -sSfL --retry 4 -o /tmp/reviews.parquet "$DATA_URL"
          python3 -I evals/iclr_calibration.py sample /tmp/reviews.parquet --out sample.jsonl
          python3 -I evals/iclr_calibration.py fetch sample.jsonl evals/iclr2026_sources.json \
            --pick balanced --dry-run --splits-out splits.json \
            $( [ -f evals/iclr2026_reviewed.json ] && echo --reviewed evals/iclr2026_reviewed.json ) \
            $( [ -f evals/iclr2026_prefer.json ] && echo --prefer evals/iclr2026_prefer.json )
          python3 -I evals/iclr_calibration.py features results --out features.jsonl
          python3 - <<'PY'
          import json, glob
          c = [json.load(open(f)).get("total_cost_usd") or 0 for f in glob.glob("results/*/run.json")]
          print(f"runs {len(c)}, total cost ${sum(c):.2f}, mean ${sum(c) / max(len(c), 1):.2f}")
          PY
          python3 -I evals/iclr_calibration.py evaluate sample.jsonl features.jsonl --splits splits.json > metrics.json || echo "too few runs to fit"
          cat metrics.json || true
          python3 -I evals/iclr_calibration.py pilot sample.jsonl features.jsonl > pilot.json || echo "pilot metrics failed"
          cat pilot.json || true
      - uses: actions/upload-artifact@v4
        with: {name: metrics, path: "*.json*", retention-days: 30}
