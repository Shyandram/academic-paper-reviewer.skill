name: ICLR calibration (paperreview.ai protocol)

# Runs the skill on ICLR 2026 submissions sampled by evals/iclr_calibration.py, then
# fits the 7-dimension linear map on the train split and reports Spearman and AUC on
# the test split. Paid: every paper is a full panel review through the API.
#
# Ground truth (human scores, decisions) never reaches the review jobs: they get the
# blinded paper text only. The evaluate job rebuilds the sample from the seed.
#
# pipeline "split" (evals/split/) runs each phase in a fresh context instead:
# Phase 0, five parallel reviewers, the literature and report check, then the EIC.
# pipeline "check" (skill 2.10.1) runs the review in one context, as "single" does.
# Both then run the optional post-review Gap Scout in a fresh context that cannot read or
# change the review.
# budget is then the cap per phase. auth "subscription" uses CLAUDE_CODE_OAUTH_TOKEN.
#
# runner "codex" (single pipeline only) runs the same prompt with the OpenAI Codex CLI
# (`codex exec`, OPENAI_API_KEY secret), model e.g. "gpt-6.1-terra", effort as Codex's
# model_reasoning_effort. Codex has no budget cap of its own: evals/codex_budget_guard.py
# prices the session's token counts with the price_* keys (USD per 1M tokens) and stops the
# run at `budget` USD per paper, after one wrap-up resume at 70% of it; run.json records
# the usage, the estimated cost and any budget stop.
# Current stage: a review run takes at most 3 papers and at most 3 USD per paper.
on:
  workflow_dispatch:
    inputs:
      split:
        description: "Which papers: all, train or test"
        default: "all"
      offset:
        description: "Skip this many papers of the split (to run in batches)"
        default: "0"
      limit:
        description: "Number of papers (0 = all). Start with a pilot of 2."
        default: "2"
      model:
        description: "Model for the review runs"
        default: "claude-haiku-5-5"
      max_parallel:
        description: "Concurrent review jobs"
        default: "2"
      pipeline:
        description: "single (one context, evals/review_prompt.md), split (one fresh context per phase, evals/split/) or check (one context plus a fresh check context)"
        default: "single"
      auth:
        description: "api (ANTHROPIC_API_KEY, billed per token) or subscription (CLAUDE_CODE_OAUTH_TOKEN)"
        default: "api"
  # Manual dispatch needs the workflow on the default branch. Until it is there, a
  # push that changes evals/iclr_run.json (same keys as the inputs) starts a run.
  # {"mode": "evaluate", "runs": [<run ids>]} only collects earlier runs' results
  # and computes the metrics.
  push:
    branches: [claude/youthful-einstein-mpsrkh, claude/next-independent-check]
    paths: [evals/iclr_run.json]

permissions:
  contents: read

env:
  # Every ICLR 2026 submission with its human reviews (withdrawn ones included).
  DATA_URL: https://huggingface.co/datasets/JerMa88/ICLR_Peer_Reviews_2026/resolve/main/data/iclr_2026.parquet
  CUTOFF: "2025-09-24"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      split: ${{ steps.c.outputs.split }}
      offset: ${{ steps.c.outputs.offset }}
      limit: ${{ steps.c.outputs.limit }}
      model: ${{ steps.c.outputs.model }}
      max_parallel: ${{ steps.c.outputs.max_parallel }}
      mode: ${{ steps.c.outputs.mode }}
      runs: ${{ steps.c.outputs.runs }}
      budget: ${{ steps.c.outputs.budget }}
      effort: ${{ steps.c.outputs.effort }}
      pick: ${{ steps.c.outputs.pick }}
      only: ${{ steps.c.outputs.only }}
      pipeline: ${{ steps.c.outputs.pipeline }}
      auth: ${{ steps.c.outputs.auth }}
      runner: ${{ steps.c.outputs.runner }}
      price_in: ${{ steps.c.outputs.price_in }}
      price_cached: ${{ steps.c.outputs.price_cached }}
      price_out: ${{ steps.c.outputs.price_out }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          cfg = {"split": "all", "offset": "0", "limit": "2", "model": "claude-haiku-5-5",
                 "max_parallel": "2", "mode": "review", "runs": "",
                 "budget": "3", "pick": "order", "only": "", "effort": "",
                 "pipeline": "single", "auth": "api", "runner": "claude",
                 "price_in": "0", "price_cached": "0", "price_out": "0"}
          given = json.loads(os.environ.get("INPUTS") or "null") or {}
          if not given and os.path.exists("evals/iclr_run.json"):
              given = json.load(open("evals/iclr_run.json"))
          if isinstance(given.get("runs"), list):
              given["runs"] = ",".join(str(r) for r in given["runs"])
          cfg.update({k: str(v) for k, v in given.items() if k in cfg})
          assert cfg["mode"] in ("review", "evaluate")
          assert cfg["pick"] in ("order", "stratified", "balanced")
          if isinstance(given.get("only"), list):
              cfg["only"] = ",".join(given["only"])
          assert re.fullmatch(r"[A-Za-z0-9_-]*(,[A-Za-z0-9_-]+)*", cfg["only"])  # paper ids (validation run)
          assert re.fullmatch(r"[0-9]+(\.[0-9]+)?", cfg["budget"])  # USD cap per paper
          assert re.fullmatch(r"[0-9,]*", cfg["runs"])
          assert cfg["split"] in ("all", "train", "test")
          assert all(cfg[k].isdigit() for k in ("offset", "limit", "max_parallel"))
          assert cfg["runner"] in ("claude", "codex")
          assert re.fullmatch(r"claude-[a-z0-9.-]+" if cfg["runner"] == "claude"
                              else r"gpt-[a-z0-9.-]+", cfg["model"])
          assert cfg["runner"] == "claude" or cfg["pipeline"] == "single"
          assert all(re.fullmatch(r"[0-9]+(\.[0-9]+)?", cfg[k])
                     for k in ("price_in", "price_cached", "price_out"))
          assert cfg["pipeline"] in ("single", "split", "check")
          assert cfg["auth"] in ("api", "subscription")
          assert cfg["effort"] in ("", "minimal", "low", "medium", "high", "xhigh", "max")
          # Current stage: at most 3 papers per experiment, and a capped spend per paper.
          MAX_PAPERS = 3
          n = len(cfg["only"].split(",")) if cfg["only"] else int(cfg["limit"])
          assert cfg["mode"] != "review" or 1 <= n <= MAX_PAPERS, f"{n} papers; this stage allows {MAX_PAPERS}"
          assert 0 < float(cfg["budget"]) <= 3, "per-paper budget must be in (0, 3] USD"
          assert cfg["runner"] != "codex" or (float(cfg["price_in"]) > 0 and float(cfg["price_out"]) > 0), \
              "a Codex run needs prices for its budget guard"
          for k, v in cfg.items():
              print(f"{k}={v}")
          PY

  prepare:
    needs: config
    if: needs.config.outputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ids: ${{ steps.find.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y poppler-utils && python -m pip install pyarrow
      - name: Sample (seeded) and find full text
        id: find
        run: |
          curl -sSfL --retry 4 -o /tmp/reviews.parquet "$DATA_URL"
          W=evals/work/benchmarks/iclr2026
          python3 -I evals/iclr_calibration.py sample /tmp/reviews.parquet --out $W/sample.jsonl
          # Text sources were found once and committed (IDs only): the paperreview.ai
          # dump (submission PDFs) or arXiv v1. OpenReview returns 403 from runners.
          python3 -I evals/iclr_calibration.py fetch $W/sample.jsonl evals/iclr2026_sources.json \
            --split "${{ needs.config.outputs.split }}" --offset "${{ needs.config.outputs.offset }}" --limit "${{ needs.config.outputs.limit }}" \
            --pick "${{ needs.config.outputs.pick }}" --ids-out ids.json \
            $( [ -n "${{ needs.config.outputs.only }}" ] && echo --only "${{ needs.config.outputs.only }}" ) \
            $( [ -f evals/iclr2026_reviewed.json ] && echo --reviewed evals/iclr2026_reviewed.json ) \
            $( [ -f evals/iclr2026_prefer.json ] && echo --prefer evals/iclr2026_prefer.json )
          python3 -c "import json,sys;n=len(json.load(open('ids.json')));sys.exit(f'{n} papers; this stage allows 3' if n>3 else 0)"
          echo "ids=$(cat ids.json 2>/dev/null || echo '[]')" >> "$GITHUB_OUTPUT"
          # Ship the blinded text only: no sample, no PDFs, no arXiv metadata.
          mkdir -p ship
          for d in evals/work/papers/iclr26-*; do
            if [ -f "$d/blinded.txt" ]; then
              mkdir -p "ship/$(basename "$d")" && cp "$d/blinded.txt" "ship/$(basename "$d")/"
            fi
          done
      - uses: actions/upload-artifact@v4
        with: {name: papers, path: ship, retention-days: 7}

  review:
    needs: [config, prepare]
    if: needs.prepare.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.config.outputs.pipeline == 'single' && needs.config.outputs.runner == 'claude' && 90 || 180 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.config.outputs.max_parallel) }}
      matrix:
        id: ${{ fromJSON(needs.prepare.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: papers, path: evals/work/papers}
      - name: Remove evaluation data from the workspace
        # Committed pilot files hold human scores and decisions; the reviewer needs only
        # the skill, the prompt and its own paper.
        run: |
          cp evals/codex_budget_guard.py "$RUNNER_TEMP/"  # runs outside the reviewer's workspace
          find evals -mindepth 1 -maxdepth 1 ! -name split ! -name work ! -name review_prompt.md -exec rm -rf {} +
          ls evals
      - run: npm install -g @anthropic-ai/claude-code
        if: needs.config.outputs.runner == 'claude'
      - run: npm install -g @openai/codex
        if: needs.config.outputs.runner == 'codex'
      - name: Review (single context)
        if: needs.config.outputs.pipeline == 'single'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ID: ${{ matrix.id }}
        run: |
          # Only this paper's text stays in the workspace.
          find evals/work/papers -mindepth 1 -maxdepth 1 ! -name "$ID" -exec rm -rf {} +
          mkdir -p "evals/work/results/$ID"
          python3 - <<'PY' > prompt.md
          import os
          root, pid = os.getcwd(), os.environ["ID"]
          t = open("evals/review_prompt.md").read().split("---", 1)[1]
          t = (t.replace("{ID}", pid).replace("{ROOT}", root)
                .replace("{VENUE_NAME}", "ICLR").replace("{VENUE_KEY}", "iclr"))
          t = t.replace("Full review, skip confirmation.",
                        "Full review, skip confirmation, literature check: strict, "
                        "cutoff date " + os.environ["CUTOFF"] + ".")
          t = t.replace("or access the web.",
                        "or access the web, except through the skill's own "
                        "scripts/related_search.py for the literature check.")
          print(t)
          PY
          [ "${{ needs.config.outputs.runner }}" = claude ] || exit 0
          claude -p "$(cat prompt.md)" --model "${{ needs.config.outputs.model }}" \
            ${{ needs.config.outputs.effort && format('--effort {0}', needs.config.outputs.effort) || '' }} \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" "Bash(python3:*)" \
            --max-budget-usd "${{ needs.config.outputs.budget }}" --output-format json > "evals/work/results/$ID/run.json" || true
          python3 -c "import json;r=json.load(open('evals/work/results/$ID/run.json'));print('cost_usd',r.get('total_cost_usd'),'turns',r.get('num_turns'))" || true
          ls -la "evals/work/results/$ID"
      - name: Review (single context, Codex)
        if: needs.config.outputs.runner == 'codex'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ID: ${{ matrix.id }}
          MODEL: ${{ needs.config.outputs.model }}
          EFFORT: ${{ needs.config.outputs.effort }}
          PRICE_IN: ${{ needs.config.outputs.price_in }}
          PRICE_CACHED: ${{ needs.config.outputs.price_cached }}
          PRICE_OUT: ${{ needs.config.outputs.price_out }}
          BUDGET: ${{ needs.config.outputs.budget }}
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "OPENAI_API_KEY secret is not set"; exit 1; }
          printenv OPENAI_API_KEY | codex login --with-api-key > /dev/null
          unset OPENAI_API_KEY
          R="evals/work/results/$ID"
          # The same prompt as the Claude run; the skill is model-neutral Markdown.
          sed -i 's/You are evaluating a Claude skill/You are evaluating a skill/' prompt.md
          CFG=(-c sandbox_mode="workspace-write" -c sandbox_workspace_write.network_access=true)
          [ -z "$EFFORT" ] || CFG+=(-c model_reasoning_effort="$EFFORT")
          start=$(date +%s); deadline=$((start + 165 * 60))
          # Per-paper API cap: the guard prices the session's token counts and stops codex at
          # the soft limit (70% of the budget; one wrap-up resume follows) and at the budget.
          PIDF="$RUNNER_TEMP/codex.pid"; STOP="$R/budget_stop.txt"
          python3 "$RUNNER_TEMP/codex_budget_guard.py" --sessions "$HOME/.codex/sessions" \
            --budget "$BUDGET" --pidfile "$PIDF" --flag "$STOP" &
          guard=$!
          sleep 3; kill -0 "$guard" || { echo "budget guard did not start; not running uncapped"; exit 1; }
          run_codex() {  # stdin file, then codex arguments; events append to codex_events.jsonl
            local in="$1"; shift
            setsid timeout $((deadline - $(date +%s)))s codex "$@" < "$in" >> "$R/codex_events.jsonl" &
            echo $! > "$PIDF"; wait $! || true
          }
          stopped() { grep -q "^$1" "$STOP" 2>/dev/null; }
          : > "$R/codex_events.jsonl"
          run_codex prompt.md exec --model "$MODEL" "${CFG[@]}" \
            --skip-git-repo-check --json -o "$R/last_message.txt" -
          # An organization rate limit (tokens per minute) can stop a turn; resume the same
          # session, which keeps everything done so far. The budget's wrap-up uses the same path.
          wrapped=""
          for i in 1 2 3 4 5 6 7 8 9; do
            stopped hard && break
            [ $((deadline - $(date +%s))) -gt 300 ] || break
            if stopped soft && [ -z "$wrapped" ]; then
              wrapped=1; echo "budget soft limit; wrap-up resume"
              msg="Stop working on the review now: the per-paper API budget is nearly used. Do no more searching and do not reread the skill files. Using what you have already done, write every deliverable now (review.md, scores_before.json, before.json, scores.json, aggregate.json, evidence.json, summary.json), marking unfinished parts as not done, and say in summary.json notes that the budget cut the run short and which phases are incomplete."
            elif tail -n 1 "$R/codex_events.jsonl" | grep -q '"turn.failed".*rate limit'; then
              echo "rate limited; resume $i"; sleep 90
              msg="Continue the task from where you stopped (the previous turn ended on an API rate limit). Do not redo finished steps."
            else
              break
            fi
            run_codex /dev/null exec resume --last --model "$MODEL" "${CFG[@]}" \
              --skip-git-repo-check --json -o "$R/last_message.txt" "$msg"
          done
          kill "$guard" 2>/dev/null || true
          cat "$STOP" 2>/dev/null || echo "budget guard: under the soft limit"
          python3 - "$R" "$start" "$HOME/.codex/sessions" <<'PY'
          import glob, json, os, sys, time
          res, start, sess = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          keys = ("input_tokens", "cached_input_tokens", "output_tokens", "reasoning_output_tokens")
          use, turns, failed, err = dict.fromkeys(keys, 0), 0, 0, None
          for line in open(os.path.join(res, "codex_events.jsonl"), errors="replace"):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get("type") == "turn.completed":
                  turns += 1
                  for k in keys:
                      use[k] += (e.get("usage") or {}).get(k, 0) or 0
                  err = None
              elif e.get("type") == "turn.failed":
                  turns += 1; failed += 1
                  err = str((e.get("error") or {}).get("message"))[:300]
          # Failed turns report no usage in the event stream; the session log has the total.
          total = None
          for f in sorted(glob.glob(os.path.join(sess, "**", "*.jsonl"), recursive=True)):
              for line in open(f, errors="replace"):
                  if '"total_token_usage"' in line:
                      try:
                          t = json.loads(line)["payload"]["info"]["total_token_usage"]
                          total = {k: t.get(k, 0) or 0 for k in keys}
                      except (ValueError, KeyError, TypeError):
                          pass
          if total and total["input_tokens"] >= use["input_tokens"]:
              use = total
          p = {k: float(os.environ[k]) for k in ("PRICE_IN", "PRICE_CACHED", "PRICE_OUT")}
          fresh = use["input_tokens"] - use["cached_input_tokens"]
          cost = (fresh * p["PRICE_IN"] + use["cached_input_tokens"] * p["PRICE_CACHED"]
                  + use["output_tokens"] * p["PRICE_OUT"]) / 1e6
          done = os.path.exists(os.path.join(res, "summary.json"))
          run = {"runner": "codex", "model": os.environ["MODEL"], "effort": os.environ["EFFORT"],
                 "usage": use, "usage_source": "session log" if use is total else "events",
                 "num_turns": turns, "failed_turns": failed,
                 "duration_ms": (int(time.time()) - start) * 1000,
                 "total_cost_usd": round(cost, 4), "cost_is_estimate": True,
                 "prices_per_mtok": p, "budget_usd": float(os.environ["BUDGET"]),
                 "budget_stop": (open(os.path.join(res, "budget_stop.txt")).read().split() or [None])[0]
                 if os.path.exists(os.path.join(res, "budget_stop.txt")) else None,
                 "is_error": err is not None or not done, "error": err}
          json.dump(run, open(os.path.join(res, "run.json"), "w"), indent=1)
          print(json.dumps(run))
          PY
          ls -la "$R"
      - name: Review (split or check, evals/split/)
        if: needs.config.outputs.pipeline != 'single'
        env:
          ANTHROPIC_API_KEY: ${{ needs.config.outputs.auth == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.config.outputs.auth == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ID: ${{ matrix.id }}
          MODEL: ${{ needs.config.outputs.model }}
          EFFORT: ${{ needs.config.outputs.effort }}
          BUDGET: ${{ needs.config.outputs.budget }}
          LIT: strict
          PIPELINE: ${{ needs.config.outputs.pipeline }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          find evals/work/papers -mindepth 1 -maxdepth 1 ! -name "$ID" -exec rm -rf {} +
          evals/split/run_paper.sh "$ID" || true
          # The shared prompt holds the paper text; the redacted copy stays in phase0/.
          rm -f "evals/work/results/$ID/prompts/shared.md"
          ls -laR "evals/work/results/$ID" | head -60
      - uses: actions/upload-artifact@v4
        with: {name: "result-${{ matrix.id }}", path: "evals/work/results/${{ matrix.id }}", retention-days: 30}

  evaluate:
    needs: [config, review]
    if: always() && needs.config.result == 'success' && (needs.review.result != 'skipped' || needs.config.outputs.mode == 'evaluate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyarrow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: "result-*", path: results}
      - name: Results of earlier runs
        if: needs.config.outputs.runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.config.outputs.runs }}
        run: |
          for id in ${RUNS//,/ }; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -p 'result-*' -D results || echo "run $id: no results"
          done
      - name: Features, cost and metrics
        run: |
          mkdir -p results
          for d in results/result-*; do [ -d "$d" ] && rm -rf "results/${d#results/result-}" && mv "$d" "results/${d#results/result-}"; done
          curl -sSfL --retry 4 -o /tmp/reviews.parquet "$DATA_URL"
          python3 -I evals/iclr_calibration.py sample /tmp/reviews.parquet --out sample.jsonl
          python3 -I evals/iclr_calibration.py fetch sample.jsonl evals/iclr2026_sources.json \
            --pick balanced --dry-run --splits-out splits.json \
            $( [ -f evals/iclr2026_reviewed.json ] && echo --reviewed evals/iclr2026_reviewed.json ) \
            $( [ -f evals/iclr2026_prefer.json ] && echo --prefer evals/iclr2026_prefer.json )
          python3 -I evals/iclr_calibration.py features results --out features.jsonl
          python3 - <<'PY'
          import json, glob
          c = [json.load(open(f)).get("total_cost_usd") or 0 for f in glob.glob("results/*/run.json")]
          print(f"runs {len(c)}, total cost ${sum(c):.2f}, mean ${sum(c) / max(len(c), 1):.2f}")
          PY
          python3 -I evals/iclr_calibration.py evaluate sample.jsonl features.jsonl --splits splits.json > metrics.json || echo "too few runs to fit"
          cat metrics.json || true
          python3 -I evals/iclr_calibration.py pilot sample.jsonl features.jsonl > pilot.json || echo "pilot metrics failed"
          cat pilot.json || true
      - uses: actions/upload-artifact@v4
        with: {name: metrics, path: "*.json*", retention-days: 30}
